<section class="catalog">
  <div class="container">

    <div class="tabs">
      <div class="tab" [class.active]="selectedCategory() === 'Все'" (click)="setCategory('Все')">Все</div>
      <div class="tab" [class.active]="selectedCategory() === 'hotel'" (click)="setCategory('hotel')">Отели</div>
      <div class="tab" [class.active]="selectedCategory() === 'restaurant'" (click)="setCategory('restaurant')">Рестораны</div>
      <div class="tab" [class.active]="selectedCategory() === 'entertainment'" (click)="setCategory('entertainment')">Развлечения</div>
      <div class="tab" [class.active]="selectedCategory() === 'nature'" (click)="setCategory('nature')">Природа</div>
      <div class="tab" [class.active]="selectedCategory() === 'culture'" (click)="setCategory('culture')">Культура</div>
      <div class="tab" [class.active]="selectedCategory() === 'architecture'" (click)="setCategory('architecture')">Архитектура</div>
      <div class="tab" [class.active]="selectedCategory() === 'spa'" (click)="setCategory('spa')">СПА и релакс</div>
    </div>

    <div class="catalog__items">
      @for (place of filteredPlaces(); track place.id) {
        <app-place-card
          [place]="place"
          [isFavorite]="favoritesService.isFavorite(place.id)"
          (toggleFavorite)="favoritesService.toggleFavorite($event)"
          (openDetails)="openDetails($event)">
        </app-place-card>
      } @empty {
        <div class="catalog__empty">
          <img src="/img/empty.png" alt="Ничего не найдено">
          <p class="empty_1">Ничего не найдено</p>
          <p class="empty_2">В этой категории пока нет уникальных мест</p>
        </div>
      }
    </div>
  </div>
  @if (selectedPlace(); as place) {
    <app-place-modal
      [place]="place"
      [isFavorite]="favoritesService.isFavorite(place.id)"
      (close)="closeDetails()"
      (toggleFavorite)="favoritesService.toggleFavorite($event)">
    </app-place-modal>
  }
</section>
